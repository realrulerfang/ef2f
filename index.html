<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео-фон</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0b0e11;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px 20px;
    box-sizing: border-box;
    color: #fff;
    text-align: center;
    gap: 24px;
  }

  .page h1 {
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 700;
    margin: 0;
  }

  .page p {
    font-size: clamp(14px, 2vw, 16px);
    opacity: 0.7;
    margin: 0;
  }

  .tweet-wrap {
    width: 100%;
    max-width: 550px;
  }
</style>
</head>
<body>

  <div class="video-bg">
    <iframe
      src="https://www.youtube.com/embed/XgnBN8BLc-o?autoplay=1&mute=1&loop=1&playlist=XgnBN8BLc-o&controls=0&showinfo=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&start=6"
      title="Background video"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="overlay"></div>

  <div class="content">
    <h1>Заголовок сайта</h1>
    <p>Подзаголовок или описание — замените этим текстом свой контент</p>
  </div>

</body>
</html>
