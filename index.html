<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео-фон</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .video-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .video-bg iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    min-height: 100vh;
    min-width: 177.78vh; /* 16:9 */
    transform: translate(-50%, -50%);
    border: 0;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }

  .content h1 {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 700;
    margin: 0 0 12px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  .content p {
    font-size: clamp(14px, 2vw, 18px);
    opacity: 0.85;
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <div class="video-bg">
    <iframe
      src="https://www.youtube.com/embed/XgnBN8BLc-o?autoplay=1&mute=1&loop=1&playlist=XgnBN8BLc-o&controls=0&showinfo=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&start=6"
      title="Background video"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="overlay"></div>

  <div class="content">
    <h1>Заголовок сайта</h1>
    <p>Подзаголовок или описание — замените этим текстом свой контент</p>
  </div>

</body>
</html>
